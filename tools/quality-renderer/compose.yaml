# Optional isolated renderer for new-api / QuantumNous.
# No host ports, host bind mounts, database, application volumes or Docker socket.
name: new-api-quality-renderer
services:
  quality-renderer:
    build: .
    image: new-api-quality-renderer:1.0.0-pw1.64.1
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    ulimits:
      nofile: {soft: 1024, hard: 1024}
      core: 0
    environment:
      QUALITY_RENDERER_TOKEN: ${QUALITY_RENDERER_TOKEN:?Set a nonempty dedicated renderer token}
    volumes:
      - renderer-socket:/run/quality-renderer:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=700
    networks: [renderer-ingress]
    depends_on:
      quality-renderer-worker:
        condition: service_healthy
    restart: "on-failure:3"

  quality-renderer-worker:
    build: .
    image: new-api-quality-renderer:1.0.0-pw1.64.1
    command: [node, src/worker.mjs]
    user: "1000:1000"
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    shm_size: 128m
    ulimits:
      nofile: {soft: 1024, hard: 1024}
      core: 0
    # Deliberately no token, main application env_file, secrets, or app volumes.
    volumes:
      - renderer-socket:/run/quality-renderer
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=700
    healthcheck:
      test: [CMD, node, src/healthcheck.mjs]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: "on-failure:3"

volumes:
  # Docker-managed socket directory only; never a host bind or artifact store.
  renderer-socket:

networks:
  renderer-ingress:
    name: new-api-quality-renderer-ingress
    internal: true
