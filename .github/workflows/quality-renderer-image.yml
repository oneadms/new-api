# Optional isolated renderer for new-api / QuantumNous; never deploys a service.
name: Publish quality renderer image (Multi-arch)

on:
  push:
    branches: [main]
    paths:
      - 'tools/quality-renderer/**'
      - '.github/workflows/quality-renderer-image.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Serialize publication so architecture tags and latest cannot mix two runs.
concurrency:
  group: quality-renderer-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify renderer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Check syntax and renderer contracts (no live browser)
        working-directory: tools/quality-renderer
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Validate local, prebuilt and application Compose configurations
        working-directory: tools/quality-renderer
        env:
          # Configuration validation only; never a deployed credential.
          QUALITY_RENDERER_TOKEN: compose-validation-only-not-a-deployment-token
        run: |
          docker compose -f compose.yaml config --quiet
          export QUALITY_RENDERER_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-quality-renderer:sha-${GITHUB_SHA}"
          docker compose -f compose.yaml -f compose.image.yaml config --quiet
          docker compose -f ../../docker-compose.yml -f compose.application.yaml config --quiet

  build_single_arch:
    name: Build and sign renderer (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-quality-renderer" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=new-api quality renderer
            org.opencontainers.image.vendor=QuantumNous
            org.opencontainers.image.description=Optional isolated HTML thumbnail renderer for new-api

      - name: Build and push native image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tools/quality-renderer
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=quality-renderer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=quality-renderer-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest and record manifest input
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "${IMAGE}@${DIGEST}"
          mkdir -p "$RUNNER_TEMP/quality-renderer-digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/quality-renderer-digests/$ARCH"
          echo "Renderer ${ARCH}: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-renderer-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/quality-renderer-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  create_manifests:
    name: Publish and sign multi-arch renderer manifest
    needs: build_single_arch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-quality-renderer" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download signed image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-renderer-digest-*
          path: ${{ runner.temp }}/quality-renderer-digests
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish commit manifest from signed digests
        run: |
          AMD64_DIGEST="$(cat "$RUNNER_TEMP/quality-renderer-digests/amd64")"
          ARM64_DIGEST="$(cat "$RUNNER_TEMP/quality-renderer-digests/arm64")"
          [[ "$AMD64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}@${AMD64_DIGEST}" "${IMAGE}@${ARM64_DIGEST}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "MANIFEST_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          {
            echo '### new-api / QuantumNous quality renderer'
            echo "Commit image: ${IMAGE}:sha-${GITHUB_SHA}"
            echo "Pin production to: ${IMAGE}@${DIGEST}"
            echo 'Platforms: linux/amd64 and linux/arm64.'
            echo 'Publication is not deployment or target-host Chromium sandbox acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest only for current main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo 'Main has advanced; latest was left unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${MANIFEST_DIGEST}"
          LATEST_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$LATEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "${IMAGE}@${LATEST_DIGEST}"
          echo "Latest: ${IMAGE}:latest (${LATEST_DIGEST})" >> "$GITHUB_STEP_SUMMARY"
